name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, dev]

jobs:
  test:
    name: Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 11

      - name: Install dependencies
        working-directory: ./interview-evaluator
        run: pnpm install --frozen-lockfile

      - name: TypeScript compile check
        working-directory: ./interview-evaluator
        run: ./node_modules/.bin/tsc --noEmit

      - name: Run unit tests
        working-directory: ./interview-evaluator
        run: ./node_modules/.bin/tsx --test test/**/*.test.ts
