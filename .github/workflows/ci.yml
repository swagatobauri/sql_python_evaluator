name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install dependencies
        working-directory: ./interview-evaluator
        run: pnpm install --frozen-lockfile

      - name: Security audit
        working-directory: ./interview-evaluator
        run: pnpm audit --prod

      - name: Code quality & formatting check (Biome)
        working-directory: ./interview-evaluator
        run: pnpm dlx @biomejs/biome ci src test

      - name: TypeScript compile check
        working-directory: ./interview-evaluator
        run: ./node_modules/.bin/tsc --noEmit

      - name: Run unit tests with coverage
        working-directory: ./interview-evaluator
        run: ./node_modules/.bin/tsx --test --experimental-test-coverage test/**/*.test.ts
